<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <section class="section">

        <div class="section-heading">
            <p>GET IN TOUCH</p>
            <h2>Contact <span>Me</span></h2>
        </div>

        <div class="contact-grid">

            <div class="contact-info">

                <h3>Let's Talk</h3>

                <p>
                    Have a project idea or want to connect?
                    Feel free to contact me.
                </p>

                <div class="contact-item">
                    <i class="fas fa-envelope"></i>

                    <div>
                        <strong>Email</strong>
                        <p>ik4012990@gmail.com</p>
                    </div>
                </div>

                <div class="contact-item">
                    <i class="fab fa-github"></i>

                    <div>
                        <strong>GitHub</strong>
                        <p>github.com/irshad7878</p>
                    </div>
                </div>

                <div class="contact-item">
                    <i class="fab fa-linkedin"></i>

                    <div>
                        <strong>LinkedIn</strong>
                        <p>linkedin.com/in/irshad-khan-5201314m</p>
                    </div>
                </div>

            </div>


            <!-- CONTACT FORM -->

            <form id="contact-form"
                  action="https://formspree.io/f/xyeyqjwq"
                  method="POST">

                <input
                    type="text"
                    name="name"
                    placeholder="Your Name"
                    required>

                <input
                    type="email"
                    name="email"
                    placeholder="Your Email"
                    required>

                <textarea
                    name="message"
                    placeholder="Your Message"
                    rows="6"
                    required></textarea>

                <button type="submit"
                        class="btn primary-btn">

                    Send Message
                    <i class="fas fa-paper-plane"></i>

                </button>

            </form>

        </div>

        <br>

        <a href="index.html" class="btn secondary-btn">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>

    </section>

</body>

</html>
